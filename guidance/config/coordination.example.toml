# Copy to ~/.ai-control-center/guidance/coordination.toml and fill in only
# browser slots that this machine owns. Paths and account labels are private.
# Owner-declared account routing is not proof of live login, workspace or plan.
# Keep unknown identity as identity_verification_pending, not assumed logged out.
# Record reported entitlement expiry with an absolute date, timezone and source;
# revalidate the entitlement before selecting that role after the reported date.

[browser]
cdp_lease_ttl_seconds = 600
cdp_targets_per_slot = 3
cdp_slot_count = 2
cdp_slot1_port = 9222
cdp_slot1_profile_dir = "/absolute/path/to/a/dedicated/browser-profile"
cdp_slot1_profile_directory = "Default"
cdp_slot1_launcher = "/absolute/path/to/the/registered/launcher"
cdp_slot1_account_alias = "account-a"
cdp_slot1_workspace = "workspace-a"
cdp_slot1_usage = "agent_authenticated_shared"
cdp_slot2_port = 9223
cdp_slot2_profile_dir = "/absolute/path/to/a/second/dedicated/browser-profile"
cdp_slot2_profile_directory = "Default"
cdp_slot2_launcher = "/absolute/path/to/the/second/registered/launcher"
cdp_slot2_account_alias = "account-b"
cdp_slot2_workspace = "workspace-b"
cdp_slot2_usage = "agent_authenticated_shared"
# Optional third and fourth persistent slots. Keep an unverified new profile
# out of automatic lease selection by
# using a usage value that contains "pending" until its identity is confirmed.
# cdp_slot_count = 4
# cdp_slot3_port = 9224
# cdp_slot3_profile_dir = "/absolute/path/to/a/third-dedicated-browser-profile"
# cdp_slot3_profile_directory = "Default"
# cdp_slot3_launcher = "/absolute/path/to/CDP Chrome 9224.app"
# cdp_slot3_account_alias = "pending"
# cdp_slot3_workspace = "pending"
# cdp_slot3_usage = "identity_verification_pending"
# cdp_slot4_port = 9225
# cdp_slot4_profile_dir = "/absolute/path/to/a/fourth-dedicated-browser-profile"
# cdp_slot4_profile_directory = "Default"
# cdp_slot4_launcher = "/absolute/path/to/CDP Chrome 9225.app"
# cdp_slot4_account_alias = "account-d"
# cdp_slot4_workspace = "workspace-d"
# cdp_slot4_usage = "workflow_reserved"
web_gpt_default_account_alias = "account-a"
web_gpt_default_workspace = "workspace-a"
web_gpt_default_policy = "general"
web_gpt_secondary_account_alias = "account-b"
web_gpt_secondary_workspace = "workspace-b"
web_gpt_secondary_policy = "secondary"
# Configure only after this machine has verified a distinct Pro-capable session.
web_gpt_pro_account_alias = "account-c"
web_gpt_pro_workspace = "workspace-c"
web_gpt_pro_policy = "pro_review_only"
web_gpt_new_chat_account_alias = "account-a"
web_gpt_new_chat_workspace = "workspace-a"
web_gpt_new_chat_surface = "codex_desktop_in_app_browser"
web_gpt_existing_chat_account_alias = "account-b"
web_gpt_existing_chat_surface = "registered_cdp_chrome_extension"
codex_chrome_extension_profile = "registered-cdp-slot-for-account-b"
codex_chrome_extension_exclusive = true
web_gpt_secondary_existing_chat_account_alias = "account-a"
web_gpt_secondary_existing_chat_surface = "codex_desktop_in_app_browser"
cdp_qa_port = 9226
cdp_qa_profile_dir = "${AICC_STATE_ROOT}/browser/isolated-qa/profile"
